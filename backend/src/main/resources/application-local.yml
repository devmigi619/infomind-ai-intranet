spring:
  datasource:
    url: jdbc:postgresql://192.168.0.248:5434/intranet
    username: intranet_user
    password: Intranet7124787@@
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.infomind.backend.domain
  configuration:
    map-underscore-to-camel-case: true

attachment:
  max-file-size: 50MB
  max-group-size: 200MB
  blob-threshold: 5MB
  storage-path: ./uploads
  allowed-extensions:
    - jpg
    - jpeg
    - png
    - gif
    - webp
    - pdf
    - doc
    - docx
    - xls
    - xlsx
    - ppt
    - pptx
    - txt
    - zip
    -

jwt:
  secret: gpu-dev-secret-key-must-be-at-least-32-characters
  expiry-hours: 8
  refresh-expiry-days: 30

fastapi:
  base-url: http://localhost:8000

logging:
  level:
    com.infomind: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
